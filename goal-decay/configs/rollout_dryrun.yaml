# Dry run before committing GPU hours to full generation.
# Per instructions: retail only, 5 tasks, 1 trial, verify schema before scaling up.

experiment: rollout_dryrun
seed: 0

model:
  name: Qwen/Qwen3.8-27B
  # Confirmed 2026-09: 27B dense (hybrid attention: 48 linear + 16 full),
  # Apache 2.0, 262144 native context, bf16 ~55.6GB / 18 shards, 64 layers,
  # hidden size 5120. Only the Qwen org HF repo is genuine.
  revision: null   # pin to a specific HF commit/tag once confirmed on the server; do not leave null for the full run

serving:
  backend: vllm
  temperature: 0.7
  max_context: 262144   # native window; actual budget for Phase 5 window-scaling arm is separate (32K/128K/262K)

benchmark:
  name: tau2-bench
  repo: sierra-research/tau2-bench
  # Pinned 2026-09-16 on the GPU server (Hazel cluster, NC State HPC).
  # Protocol requirement: all 2,000 trajectories come from one named version.
  pinned_commit: "2174a603f6d014ef94473ffa95957f6ce27100db"
  install_note: "uv sync, NOT pip install -e . -- needs Python >=3.12,<3.14"
  cli_template: "tau2 run --domain {domain} --agent-llm {agent_llm} --user-llm {user_llm} --num-trials {num_trials} --num-tasks {num_tasks}"
  # Local patch required on top of the pinned commit -- see
  # tau2_bench.patch in this directory. Apply with:
  #   cd <tau2-bench checkout> && git apply <path>/tau2_bench.patch
  # Three changes, all required before any trajectory generation:
  #   1. Add `websockets` to pyproject.toml deps -- tau2/__init__.py
  #      unconditionally imports from tau2.voice.audio_native.openai.provider,
  #      which imports websockets even though we never use --audio-native.
  #      Without this the `tau2` CLI fails to import at all.
  #   2. DEFAULT_LLM_NL_ASSERTIONS in config.py: "gpt-4.1-2025-04-14" ->
  #      "hosted_vllm/Qwen/Qwen3.8-27B". The NL-assertions evaluator
  #      (tau2/evaluator/evaluator_nl_assertions.py, marked
  #      "experimental/WIP" in tau2's own AGENTS.md) calls this model to
  #      grade natural-language evaluation criteria on some tasks. It is
  #      hardcoded with no CLI/env override, and defaults to a real
  #      OpenAI API call requiring OPENAI_API_KEY -- which we deliberately
  #      do not want, both to keep the pipeline fully self-hosted/free and
  #      to avoid a second, closed-source model silently entering the
  #      grading path. Discovered when 3/5 dry-run tasks failed with
  #      infrastructure_error / litellm.AuthenticationError.
  #   3. DEFAULT_LLM_NL_ASSERTIONS_ARGS: added
  #      "response_format": {"type": "json_object"}. The evaluator does
  #      `json.loads(assistant_message.content)` on the grading call's raw
  #      response with no structured-output enforcement -- GPT-4.1 follows
  #      a "respond in pure JSON" prompt instruction reliably enough that
  #      upstream never needed enforcement, but Qwen3.8-27B does not
  #      without it (emits reasoning text inline, breaking json.loads).
  #      Discovered when fix #2 alone still left 3/5 dry-run tasks failing
  #      with infrastructure_error / json.decoder.JSONDecodeError:
  #      "Expecting value: line 1 column 1 (char 0)". With all three fixes
  #      applied, a 5-task retail dry run completed 5/5 with zero infra
  #      errors (verified 2026-09-17).
  patch_applied: true

domains: [retail]   # dry run: retail only. Full run: [retail, airline, telecom]

dry_run:
  num_tasks: 5
  num_trials: 1

full_run:
  num_trials: 5   # seeds 0-4, per protocol §2.4
  # num_tasks omitted = all tasks in domain

logging:
  # Protocol §2.4 required per-step fields -- the dry run's job is to
  # verify every one of these is actually populated, not just present as a key.
  required_step_fields:
    - step_idx
    - cumulative_tokens
    - tokens_added_this_step
    - tool_name
    - tool_errored
    - message_role
  required_trajectory_fields:
    - task_id
    - domain
    - seed
    - goal_text
    - full_message_list
    - programmatic_reward   # from tau2-bench's own grading, 1/0

output_dir: results/rollout_dryrun
raw_trajectories_path: data/raw/trajectories_dryrun.jsonl
